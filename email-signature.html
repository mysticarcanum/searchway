<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Signature</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Apopotos:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 32px;
            font-family: 'Apopotos', Arial, sans-serif;
            background: #fff;
        }
        .signature-container {
            max-width: 720px;
            min-width: 420px;
            margin: 0 auto;
            background: none;
            border-radius: 0;
            box-shadow: none;
            border: none;
            padding: 0;
        }
        .signature {
            display: flex;
            align-items: center;
            position: relative;
            padding: 0;
            min-height: 120px;
            background: #fff;
        }
        /* Animated dithered background inspired by provided image */
        .signature::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background-image:
                repeating-linear-gradient(135deg, #f8f6f2 0px, #f8f6f2 2px, #eae6da 2px, #eae6da 4px),
                repeating-linear-gradient(45deg, #eae6da 0px, #eae6da 2px, #f8f6f2 2px, #f8f6f2 4px),
                repeating-linear-gradient(90deg, #eae6da 0px, #eae6da 1.5px, #f8f6f2 1.5px, #f8f6f2 3px);
            background-size: 16px 16px, 24px 24px, 32px 32px;
            opacity: 0.7;
            animation: ditherMove 12s linear infinite;
        }
        @keyframes ditherMove {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 32px 32px, 48px 48px, 64px 64px; }
        }
        .logo-section {
            flex: 0 0 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            z-index: 2;
            margin-right: 32px;
        }
        .logo-section a {
            display: inline-block;
            border-radius: 10px;
            transition: box-shadow 0.2s;
        }
        .logo-section a:hover {
            box-shadow: 0 0 0 3px #eae6da;
        }
        .logo-section img {
            width: 60px;
            height: 60px;
            display: block;
            background: #fff;
            border-radius: 10px;
        }
        .info-section {
            flex: 1;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .company {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 2px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #29434E;
            font-family: 'Apopotos', Arial, sans-serif;
        }
        .tagline {
            font-size: 13px;
            font-weight: 400;
            margin: 0 0 14px 0;
            color: #6b6b6b;
            letter-spacing: 0.5px;
            font-family: 'Apopotos', Arial, sans-serif;
        }
        .name {
            font-family: 'Aboreto', cursive;
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 4px 0;
            color: #29434E;
            letter-spacing: 1px;
            text-shadow: 0 1.5px 0 #fff, 0 0.5px 0 #eae6da;
            text-transform: none;
        }
        .title {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 12px 0;
            color: #7d7d7d;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Apopotos', Arial, sans-serif;
        }
        .contact-info {
            color: #29434E;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Apopotos', Arial, sans-serif;
            letter-spacing: 0.5px;
            margin: 0;
        }
        .team-email {
            color: #29434E;
            text-decoration: none;
            font-weight: 700;
            border-bottom: 1.5px dotted #bdbdbd;
            transition: color 0.2s;
        }
        .team-email:hover {
            color: #6b6b6b;
        }
        /* Email client compatibility */
        table {
            border-collapse: collapse;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }
        .signature * {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        @media (max-width: 600px) {
            .signature {
                flex-direction: column;
                align-items: flex-start;
                min-width: 0;
            }
            .logo-section {
                margin-right: 0;
                margin-bottom: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- This is your signature - copy the content inside this container -->
    <div class="signature-container">
        <div class="signature">
            <div class="logo-section">
                <a href="https://ourfuturehealth.org.uk/" target="_blank" rel="noopener">
                    <img src="https://i.postimg.cc/XZyR0bJP/our-future-health-logo.png" alt="Our Future Health Logo" />
                </a>
            </div>
            <div class="info-section">
                <div class="company">Our Future Health</div>
                <div class="tagline">Let’s prevent disease together.</div>
                <div class="name">Ibrahim Yussuf</div>
                <div class="title">Quality Operations Coordinator</div>
                <div class="contact-info">
                    Team: <a href="mailto:qualityoperations@ourfuturehealth.org.uk" class="team-email">qualityoperations@ourfuturehealth.org.uk</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
